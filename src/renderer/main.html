<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Main</title>
    <style>
      .avatar_container {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-app-region: drag;
        overflow: hidden;
      }

      .wiggle {
        animation: wiggle 4s ease-in-out infinite;
      }

      @keyframes wiggle {
        0% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
        100% {
          transform: rotate(-2deg);
        }
      }

      .avatar_image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main/main.tsx"></script>
  </body>
</html>
