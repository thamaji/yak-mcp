<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Main</title>
    <style>
      .avatar_container {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-app-region: drag;
        overflow: hidden;
      }

      .sway {
        animation: sway 4s ease-in-out infinite;
        transform-origin: center bottom;
      }

      @keyframes sway {
        0% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
        100% {
          transform: rotate(-2deg);
        }
      }

      .weight-shift {
        transform-origin: center bottom;
        animation: weight-shift 6s ease-in-out infinite;
      }

      @keyframes weight-shift {
        0%,
        100% {
          transform: translateX(-2px) rotate(-1deg);
        }
        50% {
          transform: translateX(2px) rotate(1deg);
        }
      }

      .breathing {
        animation: breathing 3.2s ease-in-out infinite;
        transform-origin: center bottom;
      }

      @keyframes breathing {
        0% {
          transform: scaleY(1);
        }
        40% {
          transform: scaleY(0.96);
        }
        50% {
          transform: scaleY(0.95);
        }
        100% {
          transform: scaleY(1);
        }
      }

      .float {
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      .avatar_image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main/main.tsx"></script>
  </body>
</html>
